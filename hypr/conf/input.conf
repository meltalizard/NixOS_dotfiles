
#############
### INPUT ###
#############

input {
    kb_layout = us,ara
    kb_variant =
    kb_model =
    kb_options = caps:swapescape,grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    repeat_delay = 200
    repeat_rate = 40

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
